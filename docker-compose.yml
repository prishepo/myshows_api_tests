version: '3.8'

services:
  # ============================================
  # ПРИЛОЖЕНИЕ (эта часть дана готовой)
  # ============================================

  msr-db:
    container_name: msr-db
    image: postgres:13-alpine
    env_file:
      - .env
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d my-shows-rating"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - test-network

  msr-backend:
    container_name: msr-backend
    build:
      context: ../my-shows-rating-master
    env_file:
      - .env
    ports:
      - "${PORT}:${PORT}"
    depends_on:
      msr-db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:${PORT}/api/v1/series"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - test-network

  # ============================================

  msr-api_tests:
    container_name: msr-api_tests
    build: ../myshows_api_tests
    env_file:
      - .env
    environment:
      - DB_HOST=msr-db
      - API_BASE_URL=http://msr-backend:8000/api/v1
    depends_on:
      msr-backend:
        condition: service_healthy
    networks:
      - test-network
    volumes:
      - ./allure-results:/app/allure-results
    command: [ "pytest", "-v", "--alluredir=/app/allure-results" ]

  # Подсказки:
  # - Используй build: ../my-shows-api-tests (путь к папке с Dockerfile)
  # - Добавь depends_on с condition: service_healthy для msr-backend
  # - Настройте environment с переменными для подключения к API и БД (при их наличии)
  # - Подключись к сети test-network

networks:
  test-network:
    driver: bridge